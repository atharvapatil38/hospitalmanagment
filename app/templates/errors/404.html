{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="display-1 fw-bold text-primary mb-3"><i class="bi bi-hospital text-muted"></i> 404</div>
            <h2 class="fw-bold text-dark mb-3">Page Not Found</h2>
            <p class="text-muted mb-4">The medical record, page, or resource you are looking for does not exist or has been relocated.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-house-door-fill me-2"></i>Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
