{% extends "base.html" %}
{% block title %}Bad Request (400){% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="display-1 fw-bold text-secondary mb-3"><i class="bi bi-x-circle-fill"></i> 400</div>
            <h2 class="fw-bold text-dark mb-3">Invalid Request</h2>

            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-arrow-left me-2"></i>Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
