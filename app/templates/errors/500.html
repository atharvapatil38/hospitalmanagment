{% extends "base.html" %}
{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="display-1 fw-bold text-warning mb-3"><i class="bi bi-exclamation-triangle-fill"></i> 500</div>
            <h2 class="fw-bold text-dark mb-3">Internal Server Error</h2>
            <p class="text-muted mb-4">An unexpected error occurred while processing your clinical request. The error has been logged for system administrators.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-house-door-fill me-2"></i>Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
