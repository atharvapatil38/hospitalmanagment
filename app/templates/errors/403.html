{% extends "base.html" %}
{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="display-1 fw-bold text-danger mb-3"><i class="bi bi-shield-lock-fill"></i> 403</div>
            <h2 class="fw-bold text-dark mb-3">Access Denied</h2>
            <p class="text-muted mb-4">You do not have the required role privileges to access this hospital administration section.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
                <i class="bi bi-arrow-left me-2"></i>Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
